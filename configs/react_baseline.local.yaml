dataset:
  root_path: data/public/input

agent:
  model: qwen3.5-35b-a3b
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: 
  max_steps: 500
  temperature: 0.0


run:
  output_dir: artifacts/runs
  run_id:                    # 留空则用 UTC 时间戳
  max_workers: 5
  task_timeout_seconds: 0
  # 三轮投票：本地 sanity check 时方便验证 r2/r3.csv 与 vote_summary.json。
  # 改 1 即退化回原行为，改 2 / 3 即开启投票。
  vote_rounds: 1
